<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>购物页面22222演示 — 数据驱动 / 深色模式 / 购物车</title>
  <style>
    :root{
      --bg:#f5f5f5; --card:#fff; --text:#222; --muted:#666;
      --primary:#ff6200; --button:#1677ff; --danger:#d93025;
      --border:#ececec; --shadow:rgba(0,0,0,0.08);
    }
    [data-theme="dark"]{
      --bg:#0b0d10; --card:#0f1418; --text:#e6eef3; --muted:#9aa6b2;
      --primary:#ff8a3d; --button:#2e9bff; --danger:#ff7365;
      --border:#1c2328; --shadow:rgba(0,0,0,0.6);
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter, "Segoe UI", Roboto, Arial, "Microsoft YaHei", sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
    .container{max-width:1100px;margin:20px auto;padding:16px}
    .notice{background:#fff3cd;color:#664d03;border:1px solid #ffe69c;padding:10px 14px;border-radius:8px;margin-bottom:16px}
    header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
    .brand{display:flex;gap:12px;align-items:center}
    .logo{width:48px;height:48px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,#ffd9b8,#ffb47a);font-size:22px}
    h1{margin:0;font-size:20px}
    .controls{display:flex;gap:8px;align-items:center}
    .search{display:flex;border:1px solid var(--border);background:var(--card);border-radius:8px;overflow:hidden}
    .search input{border:0;padding:8px 10px;min-width:200px;background:transparent;color:var(--text)}
    .search button{border:0;padding:8px 12px;background:var(--button);color:#fff;cursor:pointer}
    .toggle-btn{border:0;padding:8px 12px;border-radius:8px;background:transparent;cursor:pointer;color:var(--text)}
    main{display:grid;grid-template-columns:1fr 320px;gap:18px}
    @media (max-width:980px){main{grid-template-columns:1fr}}
    .products{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
    .product{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;box-shadow:0 2px 8px var(--shadow);display:flex;flex-direction:column;gap:8px}
    .product .image{height:140px;border-radius:8px;display:grid;place-items:center;font-size:44px;background:linear-gradient(135deg,#f5d8c2,#fff)}
    .product h3{margin:0;font-size:16px}
    .price{color:#f40;font-weight:700;font-size:18px}
    .actions{margin-top:auto;display:flex;gap:8px}
    button.btn{border:0;padding:8px 10px;border-radius:8px;cursor:pointer}
    button.add{background:var(--button);color:#fff}
    button.info{background:transparent;border:1px solid var(--border)}
    /* 右侧栏 */
    aside.card{background:var(--card);border:1px solid var(--border);padding:12px;border-radius:10px;box-shadow:0 2px 8px var(--shadow)}
    .cart-list{display:flex;flex-direction:column;gap:10px;max-height:380px;overflow:auto;padding-right:6px}
    .cart-item{display:flex;gap:8px;align-items:center}
    .cart-item .icon{width:48px;height:48;border-radius:6px;background:linear-gradient(135deg,#ffe9e0,#ffd1c6);display:grid;place-items:center}
    .qty{display:inline-flex;gap:6px;align-items:center}
    .small{font-size:13px;color:var(--muted)}
    .muted{color:var(--muted)}
    .camera-panel{margin-top:12px}
    video{width:100%;max-height:280px;border-radius:8px;background:#000;object-fit:cover;display:block}
    .btn-danger{background:var(--danger);color:#fff;border:0;padding:8px 10px;border-radius:8px;cursor:pointer}
    .empty{padding:24px;text-align:center;color:var(--muted)}
    footer{margin-top:18px;font-size:13px;color:var(--muted)}
    /* accessibility helper */
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="notice" id="topNotice" role="status" aria-live="polite">
      示例页面：点击“打开摄像头”将请求设备权限（仅在 HTTPS 或 localhost 有效）。购物车数据会保存在本地。
    </div>

    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">商</div>
        <div>
          <h1>购物页面演示</h1>
          <div class="small">数据驱动 · 深色模式 · 购物车示例</div>
        </div>
      </div>

      <div class="controls">
        <div class="search" role="search" aria-label="搜索商品">
          <label for="q" class="sr-only">搜索商品</label>
          <input id="q" type="search" placeholder="搜索商品、品牌或分类" aria-label="搜索商品" />
          <button id="searchBtn" aria-label="搜索">搜索</button>
        </div>

        <button id="themeToggle" class="toggle-btn" aria-pressed="false" title="切换深色/浅色模式">切换主题</button>
      </div>
    </header>

    <main>
      <section>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <h2 style="margin:0">推荐商品</h2>
          <div class="small" id="resultInfo">加载中…</div>
        </div>

        <div class="products" id="products" aria-live="polite">
          <!-- JS 渲染商品卡片 -->
        </div>

        <div class="camera-panel" id="cameraPanel" aria-labelledby="cameraTitle" style="margin-top:18px">
          <h3 id="cameraTitle" style="margin:0 0 8px 0">摄像头（可选）</h3>
          <p class="small muted">摄像头仅在安全上下文（https 或 localhost）可用。</p>
          <video id="preview" autoplay playsinline muted></video>
          <div style="display:flex;gap:8px;margin-top:8px">
            <button id="startCamera" class="btn add" type="button">打开摄像头</button>
            <button id="stopCamera" class="btn btn-danger" type="button" disabled>关闭摄像头</button>
          </div>
          <div id="cameraStatus" class="small muted" style="margin-top:8px">状态：等待操作</div>
        </div>
      </section>

      <aside class="card" aria-labelledby="cartTitle">
        <h3 id="cartTitle">购物车</h3>
        <div id="cart*
