<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>调用摄像头示例</title>
</head>
<body>
    <h1>正在连接抖音聊天室，等待中</h1>
    <video id="myVideo" autoplay playsinline width="400" height="300" style="background:#000;"></video>
    <script>
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                const videoElement = document.getElementById('myVideo');
                videoElement.srcObject = stream;
            })
            .catch(error => {
                console.error("获取媒体设备失败:", error);
            });
    </script>
</body>
</html>
